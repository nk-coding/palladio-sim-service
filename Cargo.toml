[package]
name = "palladio-sim-service"
description = "mdeo plugin service Palladio Simulation: simulates the plain Palladio (PCM) part of a model with SimOxide (load profiles, SPD + HPA autoscaling) and returns the measurements"
version = "0.2.0"
edition = "2024"
license = "EPL-2.0"
default-run = "palladio-sim-service"

[lib]
name = "palladio_sim_service"
path = "src/lib.rs"

[dependencies]
simoxide-emf-core = { path = "../simoxide/crates/foundation/simoxide-emf-core" }
simoxide-model = { path = "../simoxide/crates/simoxide-model" }
# EPL-only build: SimOxide's fast mode (SimuLizar's semantics, not its random numbers).
simoxide-sim = { path = "../simoxide/crates/simoxide-sim" }
# dynamic runs: SimOxide's SPD layer with the HPA, and Slingshot's adjustments (EPL default builds)
simoxide-spd = { path = "../simoxide/crates/simoxide-spd", features = ["sim"] }
simoxide-reconf = { path = "../simoxide/crates/simoxide-reconf" }

axum = { version = "0.8", features = ["ws"] }
ciborium = "0.2"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
jsonwebtoken = "9"
lru = "0.12"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
mimalloc = { version = "0.1", default-features = false, optional = true }

[features]
# SimuLizar-exact mode for the `roundtrip` command's comparison with the reference. Local use
# only: it links code for which no licence is granted (SimOxide's LICENSES, section 7), so a
# build with it must not be distributed. The plugin build leaves it off (pcmEvaluate always runs
# the fast mode).
exact = ["simoxide-sim/exact"]
# mimalloc as the global allocator, for the static musl build (musl's malloc is slow for this
# allocation-heavy workload). The default (glibc) build keeps the system allocator.
mimalloc = ["dep:mimalloc"]

[dev-dependencies]
tokio-tungstenite = "0.26"
rsa = "0.9"
rand = "0.8"

[profile.release]
lto = "thin"
codegen-units = 8
# Simulations run behind catch_unwind: a panic fails the evaluation, not the service.
panic = "unwind"

[profile.test]
opt-level = 2
